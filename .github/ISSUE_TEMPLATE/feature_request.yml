name: "🚀 Feature Request"
description: "Propose a new feature, infrastructure component, or automation enhancement"
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for improving this homelab infrastructure? We welcome feature proposals! Please describe your request below.

  - type: textarea
    id: summary
    attributes:
      label: "🎯 Feature Summary"
      description: "A clear and concise description of the proposed feature or enhancement."
      placeholder: "Describe the feature or component you would like added..."
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: "🛠️ Target Area / Category"
      options:
        - "Infrastructure & Virtualization (Stage 1)"
        - "Kubernetes & Workload Orchestration (Stage 2)"
        - "Networking & Ingress / Service Mesh"
        - "Automation, Scripts & Ansible"
        - "CI/CD & Developer Tooling"
        - "Architecture & ADRs"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "💡 Problem Statement / Motivation"
      description: "Is your feature request related to a problem or limitation? Describe the context."
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "🚀 Proposed Solution & Implementation Details"
      description: "Describe the desired solution and any specific implementation ideas or design details."

  - type: textarea
    id: alternatives
    attributes:
      label: "🔄 Alternatives Considered"
      description: "Describe any alternative solutions or features you've considered."

  - type: checkboxes
    id: willingness
    attributes:
      label: "🤝 Contribution Intent"
      options:
        - label: "I am willing to submit a PR to implement this feature!"
