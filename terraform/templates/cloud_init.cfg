#cloud-config
# System user setup
users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}

# Basic system settings
hostname: ${hostname}
manage_etc_hosts: true
package_update: true
package_upgrade: false

# Useful base utilities
packages:
  - curl
  - wget
  - qemu-guest-agent
  - htop

# Ensure qemu-guest-agent starts on boot for IP reporting to libvirt
runcmd:
  - systemctl enable --now qemu-guest-agent