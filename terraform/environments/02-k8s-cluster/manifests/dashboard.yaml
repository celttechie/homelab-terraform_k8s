apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-dashboard-html
  namespace: monitoring
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Homelab K8s Cluster Dashboard</title>
      <style>
        :root {
          --bg-primary: #0f172a;
          --bg-card: #1e293b;
          --text-primary: #f8fafc;
          --text-secondary: #94a3b8;
          --accent-blue: #38bdf8;
          --accent-green: #22c55e;
          --accent-purple: #a855f7;
          --border: #334155;
        }
        body {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          background: var(--bg-primary);
          color: var(--text-primary);
          margin: 0;
          padding: 2rem;
        }
        .header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 2rem;
          padding-bottom: 1rem;
          border-bottom: 1px solid var(--border);
        }
        .title-group h1 { margin: 0; font-size: 1.8rem; color: var(--accent-blue); }
        .title-group p { margin: 0.25rem 0 0; color: var(--text-secondary); }
        .status-badge {
          background: rgba(34, 197, 94, 0.15);
          color: var(--accent-green);
          border: 1px solid var(--accent-green);
          padding: 0.5rem 1rem;
          border-radius: 9999px;
          font-weight: 600;
        }
        .grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
          gap: 1.5rem;
          margin-bottom: 2rem;
        }
        .card {
          background: var(--bg-card);
          border: 1px solid var(--border);
          border-radius: 0.75rem;
          padding: 1.5rem;
        }
        .card-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 1rem;
        }
        .card-title { font-weight: 600; font-size: 1.1rem; color: var(--text-secondary); }
        .card-value { font-size: 2.2rem; font-weight: 700; color: var(--accent-blue); }
        .node-list {
          list-style: none;
          padding: 0;
          margin: 0;
        }
        .node-item {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0.75rem 0;
          border-bottom: 1px solid var(--border);
        }
        .node-item:last-child { border-bottom: none; }
        .node-name { font-weight: 600; }
        .node-role {
          font-size: 0.8rem;
          background: var(--border);
          padding: 0.2rem 0.5rem;
          border-radius: 4px;
          color: var(--text-secondary);
        }
      </style>
    </head>
    <body>
      <div class="header">
        <div class="title-group">
          <h1>⚡ Homelab K8s Cluster Dashboard</h1>
          <p>Stage 2 Downstream Kubernetes Cluster - End-to-End Ingress Status</p>
        </div>
        <div class="status-badge">● CLUSTER ONLINE</div>
      </div>

      <div class="grid">
        <div class="card">
          <div class="card-header">
            <span class="card-title">Cluster Subnet</span>
          </div>
          <div class="card-value" style="color: var(--accent-purple);">192.168.10.0/24</div>
          <p style="color: var(--text-secondary); margin: 0.5rem 0 0;">Private NAT VPC Perimeter</p>
        </div>

        <div class="card">
          <div class="card-header">
            <span class="card-title">Active Nodes</span>
          </div>
          <div class="card-value">3</div>
          <p style="color: var(--text-secondary); margin: 0.5rem 0 0;">1 Control Plane + 2 Workers</p>
        </div>

        <div class="card">
          <div class="card-header">
            <span class="card-title">Ingress NodePort</span>
          </div>
          <div class="card-value" style="color: var(--accent-green);">:30080</div>
          <p style="color: var(--text-secondary); margin: 0.5rem 0 0;">Routed via Stage 1 Hypervisor</p>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Cluster Topology & Node Allocations</span>
        </div>
        <ul class="node-list">
          <li class="node-item">
            <div>
              <span class="node-name">k8s-control-plane</span>
              <span class="node-role">Control Plane</span>
            </div>
            <span style="color: var(--accent-blue);">192.168.10.10</span>
          </li>
          <li class="node-item">
            <div>
              <span class="node-name">k8s-worker-01</span>
              <span class="node-role">Worker</span>
            </div>
            <span style="color: var(--accent-green);">192.168.10.21</span>
          </li>
          <li class="node-item">
            <div>
              <span class="node-name">k8s-worker-02</span>
              <span class="node-role">Worker</span>
            </div>
            <span style="color: var(--accent-green);">192.168.10.22</span>
          </li>
        </ul>
      </div>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-dashboard
  namespace: monitoring
  labels:
    app: cluster-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cluster-dashboard
  template:
    metadata:
      labels:
        app: cluster-dashboard
    spec:
      containers:
        - name: dashboard
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html-volume
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html-volume
          configMap:
            name: cluster-dashboard-html
---
apiVersion: v1
kind: Service
metadata:
  name: cluster-dashboard-service
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: cluster-dashboard
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
