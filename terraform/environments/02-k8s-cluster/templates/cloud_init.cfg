#cloud-config
# System user setup for Kubernetes Nodes
users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}

# Basic system settings
hostname: ${hostname}
manage_etc_hosts: true
package_update: true
package_upgrade: false

# Base utilities & Kubernetes prerequisites
packages:
  - curl
  - wget
  - qemu-guest-agent
  - htop
  - net-tools
  - apt-transport-https
  - ca-certificates
  - gpg

# Kubernetes Kernel Modules & Network Sysctl Prerequisites
write_files:
  - path: /etc/modules-load.d/k8s.conf
    permissions: '0644'
    content: |
      overlay
      br_netfilter
  - path: /etc/sysctl.d/k8s.conf
    permissions: '0644'
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1

# First-boot node preparation: Load modules, apply sysctl, and disable swap
runcmd:
  - systemctl enable --now qemu-guest-agent
  - modprobe overlay
  - modprobe br_netfilter
  - sysctl --system
  - swapoff -a
  - sed -i '/ swap / s/^\(.*\)$/#\1/g' /etc/fstab
