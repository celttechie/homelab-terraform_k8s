#cloud-config
# System user setup
users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: [libvirt, kvm]
    ssh_authorized_keys:
      - ${ssh_public_key}

# Basic system settings
hostname: ${hostname}
manage_etc_hosts: true
package_update: true
package_upgrade: false

# Base hypervisor utilities & packages
packages:
  - curl
  - wget
  - qemu-guest-agent
  - htop
  - bridge-utils
  - acl
  - net-tools
  - qemu-kvm
  - libvirt-daemon-system
  - libvirt-clients

# Embedded Host Bootstrap Script for Manual Audit & Verification
write_files:
  - path: /usr/local/bin/bootstrap-host.sh
    permissions: '0755'
    content: |
      ${indent(6, bootstrap_script)}
  - path: /etc/apparmor.d/local/abstractions/libvirt-qemu
    permissions: '0644'
    content: |
      /var/lib/libvirt/images/** rwk,

# First-boot hypervisor storage setup, AppArmor reload, and prerequisite audit
runcmd:
  - systemctl enable --now qemu-guest-agent libvirtd
  - mkdir -p /var/lib/libvirt/images
  - chown libvirt-qemu:kvm /var/lib/libvirt/images
  - chmod 2775 /var/lib/libvirt/images
  - sh -c 'systemctl reload apparmor || true'
  - sh -c 'virsh pool-define-as default dir --target /var/lib/libvirt/images || true'
  - sh -c 'virsh pool-autostart default || true'
  - sh -c 'virsh pool-start default || true'
  - sh -c 'virsh net-autostart default || true'
  - sh -c 'virsh net-start default || true'
  - sh -c '/usr/local/bin/bootstrap-host.sh --check ubuntu > /var/log/bootstrap-audit.log 2>&1 || true'
